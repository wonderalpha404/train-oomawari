<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JR東日本 大回り経路検索</title>
<style>
body{margin:0;background:#f6f7f9;color:#222;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:20px;margin:16px 0}h1{font-size:1.5rem}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:700px){.grid{grid-template-columns:1fr}}label{display:block;font-weight:700;margin:8px 0}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #aaa;border-radius:8px;font-size:1rem}.results{display:none;border:1px solid #ddd;border-radius:8px;max-height:240px;overflow:auto;background:white}.option{padding:9px 12px;cursor:pointer}.option:hover{background:#eef3ff}.muted{color:#666;font-size:.9rem}button{margin-top:16px;padding:12px 18px;border:0;border-radius:8px;background:#1769e0;color:#fff;font-size:1rem}button:disabled{opacity:.5}.route{white-space:pre-wrap;overflow:auto;font-family:ui-monospace,monospace;font-size:.88rem}.progress{height:6px;background:#eee;border-radius:4px;margin-top:14px}.bar{height:100%;width:0;background:#1769e0}
</style></head>
<body><div class="wrap">
<div class="card"><h1>JR東日本 大回り経路検索</h1><p>駅名を検索して出発駅・到着駅を選択すると、最大営業キロの経路を計算します。</p><p class="muted">駅検索と最適化は利用者のブラウザ内で実行します。鉄道データはサイトに同梱したCSVです。</p></div>
<div class="card"><div class="grid">
<div><label>出発駅</label><input id="start" autocomplete="off" placeholder="例：東京"><div id="start-results" class="results"></div></div>
<div><label>到着駅</label><input id="target" autocomplete="off" placeholder="例：新宿"><div id="target-results" class="results"></div></div>
</div><button id="solve" disabled>最大経路を計算</button><div class="progress"><div id="bar" class="bar"></div></div><p id="status" class="muted">駅データを読み込んでいます…</p></div>
<div id="result-card" class="card" hidden><h2>計算結果</h2><div id="result" class="route"></div></div>
<div class="card"><p class="muted"><a href="https://github.com/wonderalpha404/train-oomawari" target="_blank" rel="noopener">GitHubリポジトリ</a></p><p class="muted">初回計算時はPyodide + SciPyの読み込みに時間がかかります。</p></div>
</div>
<script src="https://cdn.jsdelivr.net/pyodide/v314.0.7/full/pyodide.js"></script>
<script>
const S={stations:[],selected:{start:null,target:null},py:null,ready:false},$=id=>document.getElementById(id);
function setup(k){const inp=$(k),box=$(k+"-results");function render(){const q=inp.value.trim(),a=S.stations.filter(x=>!q||x.name.includes(q)||x.reading.includes(q)).slice(0,30);box.innerHTML=a.map(x=>'<div class="option" data-n="'+x.name.replace(/"/g,"&quot;")+'">'+x.name+' <span class="muted">'+x.reading+'</span></div>').join("");box.style.display=a.length?"block":"none";box.querySelectorAll(".option").forEach(e=>e.onclick=()=>{inp.value=e.dataset.n;S.selected[k]=e.dataset.n;box.style.display="none";check()})}inp.oninput=()=>{S.selected[k]=null;render();check()};inp.onfocus=render;document.addEventListener("click",e=>{if(e.target!==inp&&!box.contains(e.target))box.style.display="none"})}
function check(){$("solve").disabled=!(S.selected.start&&S.selected.target)}
async function load(){if(S.ready)return;S.py=await loadPyodide({indexURL:"https://cdn.jsdelivr.net/pyodide/v314.0.7/full/"});$("bar").style.width="15%";await S.py.loadPackage("scipy");$("bar").style.width="35%";const [p,c]=await Promise.all([fetch("oomawari.py").then(r=>r.text()),fetch("data.csv").then(r=>r.text())]);S.py.FS.writeFile("/oomawari.py",p);S.py.FS.writeFile("/data.csv",c);S.py.runPython("exec(compile(open('/oomawari.py',encoding='utf-8').read(),'/oomawari.py','exec'),globals())");S.ready=true}
async function solve(){const b=$("solve");b.disabled=true;$("result-card").hidden=true;try{ $("status").textContent="最適化を実行中です。端末内で計算しています…";await load();$("bar").style.width="50%";const a=JSON.stringify(S.selected.start),t=JSON.stringify(S.selected.target);const r=S.py.runPython(`stations, edges, index = load_graph(Path("/data.csv"))
distance, route_edges = longest_simple_path(${a}, ${t}, stations, edges, index)
format_result(${a}, ${t}, distance, route_edges)`);$("result").textContent=r;$("result-card").hidden=false;$("bar").style.width="100%";$("status").textContent="計算完了"}catch(e){$("status").textContent="計算エラー: "+(e.message||e);$("bar").style.width="0"}finally{check()}}
(async()=>{try{S.stations=await fetch("stations.json").then(r=>r.json());setup("start");setup("target");$("start").value="東京";$("target").value="新宿";S.selected.start="東京";S.selected.target="新宿";check();$("status").textContent=S.stations.length+"駅を読み込みました。"}catch(e){$("status").textContent="駅データの読み込みに失敗しました: "+e}})();$("solve").onclick=solve;
</script></body></html>
