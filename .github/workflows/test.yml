name: Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install solver dependency
        run: python3 -m pip install --quiet scipy
      - name: Run unit tests
        run: python3 -m unittest -v
