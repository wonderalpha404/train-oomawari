name: Bootstrap railway data

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download dataset once
        if: ${{ !hashFiles('data/tokyo_near_zone.csv') }}
        run: |
          mkdir -p data
          curl -L --fail --retry 3 'https://note.com/api/v2/attachments/download/40553956b499e4fc2e32953c906bf574' -o data/tokyo_near_zone.csv
          test $(wc -l < data/tokyo_near_zone.csv) -eq 728
      - name: Commit dataset
        if: ${{ hashFiles('data/tokyo_near_zone.csv') }}
        run: |
          if git diff --quiet -- data/tokyo_near_zone.csv; then
            echo 'Dataset already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/tokyo_near_zone.csv
          git commit -m 'Add Tokyo near-zone railway dataset'
          git push
