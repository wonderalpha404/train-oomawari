permissions:
  contents: read

jobs:
  solve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check data
        run: |
          test -f data/tokyo_near_zone.csv
          echo "data lines: $(wc -l < data/tokyo_near_zone.csv)"

      - name: Install solver dependency
        run: python3 -m pip install --quiet scipy

      - name: Run solver
        env:
          START: ${{ inputs.start }}
          TARGET: ${{ inputs.target }}
        run: |
          python3 oomawari.py "$START" "$TARGET" | tee result.txt

      - name: Publish result
        uses: actions/upload-artifact@v4
        with:
          name: omawari-result
          path: result.txt
